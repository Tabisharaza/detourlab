name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: ['24.22.1']
    defaults:
      run:
        shell: bash
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      EXPECTED_NODE_VERSION: ${{ matrix.node }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the matrix Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Record toolchain and validate the lockfile
        run: |
          node --version
          npm --version
          node --input-type=module -e "import assert from 'node:assert/strict'; assert.equal(process.versions.node, process.env.EXPECTED_NODE_VERSION)"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Check syntax, run all tests, and build
        run: npm run check

      - name: Exercise CLI success, threshold-failure, and invalid-input gates
        run: node --test tests/cli.test.js tests/experiment-cli.test.js tests/cli-arguments.test.js tests/job-impact-cli.test.js tests/job-gates-cli.test.js tests/experiment-report-cli.test.js tests/review-verification-cli.test.js tests/cutoff-comparison-cli.test.js tests/seed-study-cli.test.js

      - name: Verify optional schema and editor tooling
        run: |
          npm ci --prefix tools/schema-check --ignore-scripts --no-audit --no-fund
          npm run verify --prefix tools/schema-check

      - name: Verify and reproduce every distribution byte
        run: |
          node scripts/verify-dist.js
          reference="$(mktemp -d "${RUNNER_TEMP}/detourlab-dist.XXXXXX")"
          trap 'rm -rf "$reference"' EXIT
          cp -R dist/. "$reference/"
          npm run build
          node scripts/verify-dist.js dist "$reference"

      - name: Verify real Chromium file roundtrips and Worker parity
        timeout-minutes: 3
        run: |
          browser="$(command -v google-chrome)"
          test -n "$browser"
          node tools/browser-check/run.js --browser "$browser" --out "$RUNNER_TEMP/detourlab-browser-evidence"

      - name: Record browser evidence even on failure
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/detourlab-browser-evidence/evidence.json"; then
            cat "$RUNNER_TEMP/detourlab-browser-evidence/evidence.json"
          fi

      - name: Measure bounded native Canvas rendering and verify parity
        timeout-minutes: 3
        run: |
          browser="$(command -v google-chrome)"
          test -n "$browser"
          node tools/render-profile/run.js --browser "$browser" --out "$RUNNER_TEMP/detourlab-render-evidence"

      - name: Record render evidence even on failure
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/detourlab-render-evidence/evidence.json"; then
            cat "$RUNNER_TEMP/detourlab-render-evidence/evidence.json"
          fi

      - name: Verify native Canvas resize and DPR recovery
        timeout-minutes: 3
        run: |
          browser="$(command -v google-chrome)"
          test -n "$browser"
          node tools/canvas-lifecycle-check/run.js --browser "$browser" --out "$RUNNER_TEMP/detourlab-canvas-lifecycle-evidence"

      - name: Record Canvas lifecycle evidence even on failure
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/detourlab-canvas-lifecycle-evidence/evidence.json"; then
            cat "$RUNNER_TEMP/detourlab-canvas-lifecycle-evidence/evidence.json"
          fi

      - name: Verify synchronized split-map replay in Chromium
        timeout-minutes: 3
        run: |
          browser="$(command -v google-chrome)"
          test -n "$browser"
          node tools/split-view-check/run.js --browser "$browser" --out "$RUNNER_TEMP/detourlab-split-evidence"

      - name: Record split-map evidence and bounded synthetic snapshots
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/detourlab-split-evidence/evidence.json"; then
            cat "$RUNNER_TEMP/detourlab-split-evidence/evidence.json"
            node --input-type=module -e '
              import { readFile } from "node:fs/promises";
              for (const name of ["split-desktop.jpg", "split-narrow.jpg"]) {
                try { const bytes = await readFile(process.env.RUNNER_TEMP + "/detourlab-split-evidence/" + name);
                  if (bytes.length > 1048576) throw new Error("Snapshot exceeds log bound");
                  console.log("SPLIT_SNAPSHOT " + name + " " + bytes.toString("base64"));
                } catch (error) { if (error.code !== "ENOENT") throw error; }
              }'
          fi

      - name: Verify portable replay bookmarks in Chromium
        timeout-minutes: 3
        run: |
          browser="$(command -v google-chrome)"
          test -n "$browser"
          node tools/replay-bookmark-check/run.js --browser "$browser" --out "$RUNNER_TEMP/detourlab-replay-evidence"

      - name: Record replay bookmark evidence and bounded synthetic snapshots
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/detourlab-replay-evidence/evidence.json"; then
            cat "$RUNNER_TEMP/detourlab-replay-evidence/evidence.json"
            node --input-type=module -e '
              import { readFile } from "node:fs/promises";
              for (const name of ["replay-desktop.jpg", "replay-narrow.jpg"]) {
                try { const bytes = await readFile(process.env.RUNNER_TEMP + "/detourlab-replay-evidence/" + name);
                  if (bytes.length > 1048576) throw new Error("Snapshot exceeds log bound");
                  console.log("REPLAY_SNAPSHOT " + name + " " + bytes.toString("base64"));
                } catch (error) { if (error.code !== "ENOENT") throw error; }
              }'
          fi

      - name: Verify replay event navigation in Chromium
        timeout-minutes: 3
        run: |
          browser="$(command -v google-chrome)"
          test -n "$browser"
          node tools/replay-events-check/run.js --browser "$browser" --out "$RUNNER_TEMP/detourlab-events-evidence"

      - name: Record replay event evidence and bounded synthetic snapshots
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/detourlab-events-evidence/evidence.json"; then
            cat "$RUNNER_TEMP/detourlab-events-evidence/evidence.json"
            node --input-type=module -e '
              import { readFile } from "node:fs/promises";
              for (const name of ["event-desktop.jpg", "event-narrow.jpg"]) {
                try { const bytes = await readFile(process.env.RUNNER_TEMP + "/detourlab-events-evidence/" + name);
                  if (bytes.length > 1048576) throw new Error("Snapshot exceeds log bound");
                  console.log("EVENT_SNAPSHOT " + name + " " + bytes.toString("base64"));
                } catch (error) { if (error.code !== "ENOENT") throw error; }
              }'
          fi

      - name: Verify recoverable experiment editing in Chromium
        timeout-minutes: 3
        run: |
          browser="$(command -v google-chrome)"
          test -n "$browser"
          node tools/experiment-history-check/run.js --browser "$browser" --out "$RUNNER_TEMP/detourlab-history-evidence"

      - name: Record edit history evidence and bounded synthetic snapshots
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/detourlab-history-evidence/evidence.json"; then
            cat "$RUNNER_TEMP/detourlab-history-evidence/evidence.json"
            node --input-type=module -e '
              import { readFile } from "node:fs/promises";
              for (const name of ["history-desktop.jpg", "history-narrow.jpg"]) {
                try { const bytes = await readFile(process.env.RUNNER_TEMP + "/detourlab-history-evidence/" + name);
                  if (bytes.length > 1048576) throw new Error("Snapshot exceeds log bound");
                  console.log("HISTORY_SNAPSHOT " + name + " " + bytes.toString("base64"));
                } catch (error) { if (error.code !== "ENOENT") throw error; }
              }'
          fi

      - name: Verify complete delivery CSV downloads in Chromium
        timeout-minutes: 3
        run: |
          browser="$(command -v google-chrome)"
          test -n "$browser"
          node tools/impact-csv-check/run.js --browser "$browser" --out "$RUNNER_TEMP/detourlab-impact-csv-evidence"

      - name: Record delivery CSV evidence and bounded synthetic snapshots
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/detourlab-impact-csv-evidence/evidence.json"; then
            cat "$RUNNER_TEMP/detourlab-impact-csv-evidence/evidence.json"
            node --input-type=module -e '
              import { readFile } from "node:fs/promises";
              for (const name of ["impact-csv-desktop.jpg", "impact-csv-narrow.jpg"]) {
                try { const bytes = await readFile(process.env.RUNNER_TEMP + "/detourlab-impact-csv-evidence/" + name);
                  if (bytes.length > 1048576) throw new Error("Snapshot exceeds log bound");
                  console.log("IMPACT_CSV_SNAPSHOT " + name + " " + bytes.toString("base64"));
                } catch (error) { if (error.code !== "ENOENT") throw error; }
              }'
          fi

      - name: Confirm verification did not change tracked source
        run: git diff --exit-code && git diff --cached --exit-code
